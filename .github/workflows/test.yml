name: Security analysis
on:
  workflow_dispatch:
    inputs:
      # Tools to use
      ## Slither
      template-ref:
        required: false
        type: string
        default: "feat/sc-analysis"
        description: "template branch ref (branch, tag, or commit SHA)"


jobs:
  slither-analysis:
    uses: "aragon/github-templates/.github/workflows/sc-security-analysis.yml@feat/sc-analysis"
    with:
      slither: true
      claude: true
      claude-template: "prompts/slither/sarif_summary.md"
      paths-to-analyze: "src/curve"
      final-cleanup: false
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

