name: Security analysis
on:
  workflow_dispatch:
    inputs:
      # Tools to use
      ## Slither
      template-ref:
        required: false
        type: string
        default: "feat/sc-analysis"
        description: "template branch ref (branch, tag, or commit SHA)"
permissions:
  contents: read
  pull-requests: read
  issues: read
  id-token: write

jobs:
  slither-analysis:
    uses: "aragon/github-templates/.github/workflows/sc-security-analysis.yml@feat/sc-analysis"
    with:
      download-repos: true
      slither: true
      claude: true
      claude-template: "prompts/slither/slither_summary.md"
      paths-to-analyze: "src/curve"
      final-cleanup: false

  exploit-generation:
    needs: slither-analysis
    uses: "aragon/github-templates/.github/workflows/sc-security-analysis.yml@feat/sc-analysis"
    with:
      claude: true
      claude-template: "prompts/slither/02-orchestrate.md"
      paths-to-analyze: "src/curve"
      upload-artifacts: true
      final-cleanup: false


