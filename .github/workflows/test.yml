name: Tests

on:
  push:
    branches:
      - "main"
      - "develop"
      - "deploy/**"
  pull_request:
  workflow_dispatch:

env:
  FOUNDRY_PROFILE: ci

jobs:
  test-unit:
    strategy:
      fail-fast: true
    name: Test Unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: foundry-toolchain
        uses: foundry-rs/foundry-toolchain@v1.3.1

      - name: Show Forge version
        run: forge --version

      - name: Run Forge build
        run: |
          forge build --sizes
        id: build

      - name: Run Forge tests
        run: |
          forge test --match-path "test/**/{unit,integration}/**/*.sol"
        id: test

  test-gas-report:
    strategy:
      fail-fast: true
    name: Gas Report
    runs-on: ubuntu-latest
    env:
      FOUNDRY_PROFILE: "gas-report"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: foundry-toolchain
        uses: foundry-rs/foundry-toolchain@v1.3.1

      - name: Show Forge version
        run: forge --version

      - name: Run Forge build
        run: |
          forge build
        id: build

      - name: Run Forge tests
        run: |
          forge test --match-path "test/**/{unit,integration}/**/*.sol" --gas-report > gasreport.ansi
        env:
          # make fuzzing semi-deterministic to avoid noisy gas cost estimation
          # due to non-deterministic fuzzing (but still use pseudo-random fuzzing seeds)
          FOUNDRY_FUZZ_SEED: 0x${{ github.event.pull_request.base.sha || github.sha }}
        id: test

      - name: Compare gas reports
        uses: Rubilmax/foundry-gas-diff@v3
        with:
          summaryQuantile: 0.8 # only display the 20% most significant gas diffs in the summary (defaults to 20%)
          sortCriteria: avg,max # sort diff rows by criteria
          sortOrders: desc,asc # and directions
          ignore: test-foundry/**/* # filter out gas reports from specific paths (test/ is included by default)
        id: gas_diff

      - name: Add gas diff to sticky comment
        if: github.event_name == 'pull_request' || github.event_name == 'pull_request_target'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: Gas cost changes
          # delete the comment in case changes no longer impact gas costs
          delete: ${{ !steps.gas_diff.outputs.markdown }}
          message: ${{ steps.gas_diff.outputs.markdown }}

  test-coverage:
    permissions:
      pull-requests: write
    strategy:
      fail-fast: true
    name: Coverage Report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: foundry-toolchain
        uses: foundry-rs/foundry-toolchain@v1.3.1

      - name: Show Forge version
        run: forge --version

      - name: Run Forge build
        run: |
          forge build
        id: build

      - name: Run Forge coverage
        run: |
          forge coverage --match-path "test/**/{unit,integration}/**/*.sol" --no-match-coverage "test/" --report lcov --report summary
        id: coverage

      - name: Setup LCOV
        uses: hrishikesh-kadam/setup-lcov@v1

      - name: Report code coverage
        uses: zgosalvez/github-actions-report-lcov@v4
        with:
          coverage-files: lcov.info
          minimum-coverage: 60
          artifact-name: code-coverage-report
          github-token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: .
          update-comment: true

  test-upgrade:
    strategy:
      fail-fast: true
    name: Test Upgrade
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: foundry-toolchain
        uses: foundry-rs/foundry-toolchain@v1.3.1

      - name: Show Forge version
        run: forge --version

      - name: Run Forge build
        run: |
          forge build --sizes
        id: build

      - name: Run Forge tests
        run: |
          forge test --match-path "test/**/upgrade/**/*.sol" --force
        id: test

  test-invariant:
    strategy:
      fail-fast: true
    name: Test Invariant
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: foundry-toolchain
        uses: foundry-rs/foundry-toolchain@v1.3.1

      - name: Run Forge build
        run: |
          forge build
        id: build

      - name: Run Forge tests
        run: |
          forge test --match-path "test/**/invariant/**/*.sol"
        id: test
    
  test-fork:
    strategy:
      fail-fast: true
    name: Test Fork
    runs-on: ubuntu-latest
    env:
      NETWORK: "sepolia"
      FORK_TEST_MODE: "new-factory"
      DEPLOY_AS_PRODUCTION: false
      TOKEN_TEST_WHALE: "0x"
      FACTORY_ADDRESS: "0x42636EcF42B17Fbb2A39e0ECf58c40726437bFE0"
      MULTISIG_MEMBERS_JSON_FILE_NAME: "/script/multisig-members.json"
      MIN_APPROVALS: 1
      MULTISIG_PROPOSAL_EXPIRATION_PERIOD: "864000"
      MINT_TEST_TOKENS: true
      TOKEN1_ADDRESS: "0x0000000000000000000000000000000000000000"
      VE_TOKEN1_NAME: "Voting Escrow Token 1"
      VE_TOKEN1_SYMBOL: "veTK1"
      TOKEN2_ADDRESS: "0x0000000000000000000000000000000000000000"
      VE_TOKEN2_NAME: "Voting Escrow Token 2"
      VE_TOKEN2_SYMBOL: "veTK2"
      FEE_PERCENT: "0" # 10_000 = 100%
      WARMUP_PERIOD: "259200" # 3 days
      COOLDOWN_PERIOD: "259200" # 3 days
      MIN_LOCK_DURATION: "1"
      VOTING_PAUSED: true
      MIN_DEPOSIT: "10000000000000000" # 0.01 ETH
      MULTISIG_PLUGIN_REPO_ADDRESS: "0x9e7956C8758470dE159481e5DD0d08F8B59217A2"
      MULTISIG_PLUGIN_RELEASE: "1"
      MULTISIG_PLUGIN_BUILD: "2"
      SIMPLE_GAUGE_VOTER_REPO_ENS_SUBDOMAIN: "gauge-voter-${{ vars.GITHUB_RUN_ID }}"
      DAO_FACTORY: "0x7a62da7B56fB3bfCdF70E900787010Bc4c9Ca42e"
      PLUGIN_SETUP_PROCESSOR: "0xC24188a73dc09aA7C721f96Ad8857B469C01dC9f"
      PLUGIN_REPO_FACTORY: "0x399ce2a71ef78be6890eb628384dd09d4382a7f0"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Load secret
        id: load_secret
        uses: 1password/load-secrets-action@v3
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN_3PARTIES }}
          ALCHEMY_APIKEY: op://kv_solutions-ghworkflows_3rdparties/alchemy/credential

      - name: foundry-toolchain
        uses: foundry-rs/foundry-toolchain@v1.3.1

      - name: Show Forge version
        run: forge --version

      - name: Run Forge build
        run: |
          forge build --sizes
        id: build

      - name: Run Forge tests
        run: |
          forge test --match-path "test/**/fork/**/*.sol" --rpc-url https://eth-sepolia.g.alchemy.com/v2/${{ steps.load_secret.outputs.ALCHEMY_APIKEY }} -vvv
