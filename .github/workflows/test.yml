name: Tests

on:
  push:
    branches:
      - 'main'
      - 'develop'
      - 'deploy/**'
  pull_request:
  workflow_dispatch:

env:
  FOUNDRY_PROFILE: ci

jobs:
  test-upgrades:
    strategy:
      fail-fast: true
    name: Test upgrades
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@v2

      - name: foundry-toolchain
        uses: foundry-rs/foundry-toolchain@v1.3.1

      - name: Show Forge version
        run: forge --version

      - name: Build
        run: bun run build-all

      - name: Run tests
        run: bun run test-upgrades
  test-fork:
    strategy:
      fail-fast: true
    name: Test fork
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@v2

      - name: foundry-toolchain
        uses: foundry-rs/foundry-toolchain@v1.3.1

      - name: Show Forge version
        run: forge --version

      - name: Build
        run: bun run build

      - name: Run tests
        run: bun run test-fork
  test-unit:
    strategy:
      fail-fast: true
    name: Test unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@v2

      - name: foundry-toolchain
        uses: foundry-rs/foundry-toolchain@v1.3.1

      - name: Show Forge version
        run: forge --version

      - name: Build
        run: bun run build

      - name: Run tests
        run: bun run test-unit
  