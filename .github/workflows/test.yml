name: Security analysis
on:
  workflow_dispatch:
    inputs:
      # Tools to use
      ## Slither
      template-ref:
        required: false
        type: string
        default: "feat/sc-analysis"
        description: "template branch ref (branch, tag, or commit SHA)"
permissions:
  contents: read
  pull-requests: read
  issues: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  security-analysis:
    strategy:
      matrix:
        include:
          - name: slither-analysis
            download-repos: true
            slither: true
            claude: true
            claude-template: "prompts/slither/01-slither_summary.md"
            upload-artifacts: false
          - name: claude-direct
            download-repos: false
            slither: false
            claude: true
            claude-template: "prompts/slither/02-claude-direct-analysis.md"
            upload-artifacts: true
      fail-fast: false  # Continue even if one fails
      max-parallel: 1
    uses: "aragon/github-templates/.github/workflows/sc-security-analysis.yml@feat/sc-analysis"
    with:
      download-repos: ${{ matrix.download-repos }}
      slither: ${{ matrix.slither }}
      claude: ${{ matrix.claude }}
      claude-template: ${{ matrix.claude-template }}
      paths-to-analyze: "src/curve"
      upload-artifacts: ${{ matrix.upload-artifacts }}
      final-cleanup: false
